name: Bump version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver type of new version (major / minor / patch)"
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    name: Bump version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
      - id: bump
        run: echo "version=$(npm version ${{ github.event.inputs.version }} --no-git-tag-version)" >> "$GITHUB_OUTPUT"
      - run: |
          git checkout -b "release/${{ steps.bump.outputs.version }}"
          git commit -am "Bump version to ${{ steps.bump.outputs.version }}"
          git push origin "release/${{ steps.bump.outputs.version }}"
      - run: |
          gh pr create \
            --base main \
            --head "release/${{ steps.bump.outputs.version }}" \
            --title "Bump version to ${{ steps.bump.outputs.version }}" \
            --body "Version bump (${{ github.event.inputs.version }}). After merging, create a GitHub release with tag \`${{ steps.bump.outputs.version }}\` targeting the merge commit on \`main\`."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
